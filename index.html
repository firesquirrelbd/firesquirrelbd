<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<title>Fire Squirrel | Buy, Sell & Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif;}
body{background:#f0f2f5;color:#2c3e50;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:0.2s;border:none}

.brand{display:flex;align-items:center;gap:8px;cursor:pointer}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-name{font-size:22px;font-weight:800;color:#fff;white-space:nowrap}
.search-bar{flex:1;display:flex;background:#fff;border-radius:20px;padding:3px;}
.search-bar select{border:none;background:transparent;padding:6px 10px;font-size:13px;border-right:1px solid #ddd;outline:none}

.search-bar button{background:#ffc800;color:#000;font-weight:bold;padding:6px 16px;border-radius:16px}

.post-btn{background:#ffc800;color:#000;font-weight:bold;padding:8px 16px;border-radius:20px;font-size:13px}
.navBtn{background:rgba(255,255,255,0.15);color:#fff;border-radius:20px;padding:8px 14px;font-size:13px}

.container{max-width:1250px;margin:auto;padding:20px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}

.sidebar{background:#fff;border-radius:8px;padding:15px;height:fit-content;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.sidebar h3{font-size:13px;color:#888;text-transform:uppercase;margin-bottom:10px}
.cat-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer;font-size:13px}
.cat-item.active, .cat-item:hover{background:#e6f4f1;color:#009877;font-weight:bold}

.feed-header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 15px;border-radius:8px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));gap:15px}
.card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);display:flex;flex-direction:column}
.pic{height:150px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:6px;left:6px;background:#009877;color:#fff;font-size:10px;padding:2px 5px;border-radius:3px}
.body{padding:12px;display:flex;flex-direction:column;flex:1}
